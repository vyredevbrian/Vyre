# Edge proxy: Caddy configured from container labels. Handles HTTPS certs automatically.
services:
  caddy:
    image: lucaslorentz/caddy-docker-proxy:2.9-alpine
    container_name: vyre-caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      CADDY_INGRESS_NETWORKS: vyre
    networks: [vyre]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data

  dashboard:
    build: ../dashboard
    container_name: vyre-dashboard
    restart: unless-stopped
    environment:
      DASH_PASSWORD: ${DASH_PASSWORD:?set in /opt/vyre/.env}
      MCP_TOKEN: ${MCP_TOKEN:-}
    networks: [vyre]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vyre:/opt/vyre
    labels:
      caddy: ${DASH_DOMAIN:?set in /opt/vyre/.env}
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  vyre:
    external: true

volumes:
  caddy_data:
